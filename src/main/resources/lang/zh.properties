app.tag=终端 coding agent（纯 JDK，零依赖）
usage=用法: jagent <命令> [选项]
commands=命令:
cmd.doctor=检查终端环境与配置
cmd.version=打印版本
cmd.help=显示本帮助
cmd.chat=单轮对话，验证流式输出与系统提示词装配
cmd.run=自主循环：模型自行调用工具直到任务完成
options=选项:
opt.provider=模型通道，默认 mock（离线，无需密钥）
opt.baseurl=OpenAI 兼容服务地址
opt.apikey=密钥（亦可用环境变量 JAGENT_API_KEY）
opt.model=廉价档模型名
opt.modelstrong=强力档模型名，默认同廉价档（竞价中标时使用）
opt.budget=token 预算上限，默认 40000
opt.compress=上下文超过该 token 数才评估压缩，默认 6000
opt.resume=从 work/plan.md 恢复目标并续跑（可省略任务描述）
opt.size=终端尺寸覆盖
opt.cwd=工作根目录，默认当前目录
opt.lang=面向用户的语言，可选 zh / eng
opt.permits=并发许可数上限，默认 4
opt.tooldelay=给工具加人为延迟（毫秒），仅用于观察并行
opt.nograph=关闭底部实时执行图

col.java=java
col.os=系统
