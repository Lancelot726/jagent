app.tag=终端 coding agent（纯 JDK，零依赖）
usage=用法: jagent <命令> [选项]
commands=命令:
cmd.doctor=检查终端环境与配置
cmd.version=打印版本
cmd.help=显示本帮助
cmd.repl=不带参数启动即进入交互式命令行（REPL）
cmd.run=自主循环：模型自行调用工具直到任务完成
options=选项:
opt.provider=模型通道，默认 mock（离线，无需密钥）
opt.baseurl=OpenAI 兼容服务地址
opt.apikey=密钥（亦可用环境变量 JAGENT_API_KEY）
opt.model=廉价档模型名
opt.modelstrong=强力档模型名，默认同廉价档（被档位选择选中时使用）
opt.baseurlstrong=强力档服务地址，留空则与廉价档同源
opt.apikeystrong=强力档密钥，留空则与廉价档同源（亦可用环境变量 JAGENT_API_KEY_STRONG）
opt.budget=token 预算上限，默认 40000
opt.compress=上下文超过该 token 数才评估压缩，默认 6000
opt.resume=从 work/plan.md 恢复目标并续跑（可省略任务描述）
opt.size=终端尺寸覆盖
opt.cwd=工作根目录，默认当前目录
opt.lang=面向用户的语言，可选 zh / eng
opt.permits=并发许可数上限，默认 4
opt.maxsteps=单轮步数上限，默认 16；设 0 表示不限步数
opt.tooldelay=给工具加人为延迟（毫秒），仅用于观察并行
opt.nograph=关闭底部实时执行图
opt.scorecard=在运行末打印对账块（默认关闭）

col.java=java
col.os=系统
col.cwd=工作目录
col.stdout=stdout 编码
col.console=控制台编码
col.locale=语言环境
col.size=终端尺寸
col.provider=模型通道
col.tier.cheap=廉价档
col.tier.strong=强力档
col.key.cheap=廉价档密钥
col.key.strong=强力档密钥
col.userlang=输出语言
tier.same=同廉价档
tier.sameSrc=注意: 两档同源，档位选择退化为同厂商内部挑选；接第二家厂商请设 base-url-strong / api-key-strong
size.note=(COLUMNS/LINES 或默认值，可用 --width 覆盖)
mock.note=离线模拟，无需密钥
key.unset=未设置 !
key.set=已设置 (%d 字符)
probe.utf8=UTF-8 探针
probe.chars=制表符
width.check=宽度校验
width.note=显示宽度=%d 字符数=%d
warn.enc=警告: stdout 编码不是 UTF-8，制表符可能乱码。
warn.chcp=本程序已强制重建 UTF-8 输出流；若仍乱码请执行 chcp 65001

firstrun.title=首次启动，请选择面向你的输出语言
firstrun.option1=1) 中文
firstrun.option2=2) English
firstrun.prompt=请输入 1 或 2 [1]:
firstrun.saved=已保存选择到 %s（可用 --user-lang 覆盖）

graph.title=graph
