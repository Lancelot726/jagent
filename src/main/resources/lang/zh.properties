score.path=路径互斥: 冲突 %d 次
score.fallback=降级: 备用档切换 %d 次 · 重试 %d 次
score.graph=执行图: 节点 %d · 完成 %d · 失败 %d · in %d out %d
score.saved=对账单已写入 %s

