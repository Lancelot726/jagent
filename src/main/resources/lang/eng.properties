app.tag=terminal coding agent (pure JDK, zero deps)
usage=usage: jagent <command> [options]
commands=commands:
cmd.doctor=inspect terminal environment and config
cmd.version=print version
cmd.help=show this help
cmd.chat=single-turn chat, verifies streaming and system prompt assembly
cmd.run=autonomous loop: the model calls tools until the task is done
options=options:
opt.provider=model channel, default mock (offline, no key needed)
opt.baseurl=OpenAI-compatible service address
opt.apikey=api key (or env JAGENT_API_KEY)
opt.model=cheap-tier model name
opt.modelstrong=strong-tier model name, defaults to cheap (used when it wins the auction)
opt.baseurlstrong=strong-tier service address, blank falls back to the cheap tier
opt.apikeystrong=strong-tier api key, blank falls back to the cheap tier (or env JAGENT_API_KEY_STRONG)
opt.budget=token budget ceiling, default 40000
opt.compress=only consider compression above this context size, default 6000
opt.resume=resume the goal from work/plan.md (task argument optional)
opt.size=terminal size override
opt.cwd=workspace root, defaults to current directory
opt.lang=user-facing language, zh / eng
opt.permits=concurrency permit ceiling, default 4
opt.tooldelay=artificial tool latency in ms, for watching parallelism
opt.nograph=disable the live execution graph at the bottom

col.java=java
col.os=os
col.cwd=cwd
col.stdout=stdout enc
col.console=console enc
col.locale=locale
col.size=term size
col.provider=provider
col.tier.cheap=cheap tier
col.tier.strong=strong tier
col.key.cheap=cheap key
col.key.strong=strong key
col.userlang=user lang
tier.same=same as cheap
tier.sameSrc=note: both tiers share one source, so the auction degrades to an intra-vendor pick; set base-url-strong / api-key-strong to add a second vendor
size.note=(COLUMNS/LINES or default, override with --width)
mock.note=offline simulation, no key needed
key.unset=unset !
key.set=set (%d chars)
probe.utf8=UTF-8 probe
probe.chars=box drawing
width.check=width check
width.note=display width=%d length=%d
warn.enc=warning: stdout encoding is not UTF-8, box drawing may be garbled.
warn.chcp=an explicit UTF-8 stream is already forced; if still garbled run chcp 65001

firstrun.title=First run: choose your user-facing language
firstrun.option1=1) 中文
firstrun.option2=2) English
firstrun.prompt=enter 1 or 2 [1]:
firstrun.saved=saved to %s (override with --user-lang)

graph.title=execution graph
graph.stat=%d nodes · %d running · %d done · %d failed
graph.tokens=tokens in=%d out=%d

score.title=mechanism scorecard
score.auction=auction: %d rounds · cheap won %d · strong won %d · profit %.2f
score.rep=reputation: cheap %.2f · strong %.2f
score.budget=budget: spent %d / cap %d (%.0f%%) · burn %.0f tok/s
score.compress=compression: %d events · %d tok saved total
score.gov=control: concurrency peak %d · permit cap %d · up %d · down %d · trips %d · error %.0f%%
score.path=path mutex: %d conflicts
score.fallback=fallback: backup switched %d times · retries %d
score.graph=graph: nodes %d · done %d · failed %d · in %d out %d
score.saved=scorecard written to %s

run.usage=usage: jagent run <task>
run.step=step
run.tool=tool
run.args=args
run.result=result
run.steps=steps
run.limit=max steps %d reached, loop stopped
run.abort=model call failed, run aborted: %s
run.bid=bid
run.budget=budget
run.credits=profit
run.compress=compressed context %d -> %d tok
run.plan=plan written to %s

err.nocfg=missing required config: %s (mandatory when provider is not mock, see help)
err.unknown=unknown command: %s
err.prefix=error: %s
